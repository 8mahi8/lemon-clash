name: Lemon Clash checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/rules.js
          node --check src/app.js
          node --check tools/build-embed.cjs
      - name: Card rules tests
        run: node --test tests/rules.test.cjs
      - name: Build one-file HTML for Google Sites
        run: node tools/build-embed.cjs
      - name: Check inlined scripts
        run: |
          test -s dist/lemon-clash-embed.html
          ! grep -q 'src="src/' dist/lemon-clash-embed.html
      - name: Save Google Sites HTML
        uses: actions/upload-artifact@v4
        with:
          name: lemon-clash-google-sites-html
          path: dist/lemon-clash-embed.html
